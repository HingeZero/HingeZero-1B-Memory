name: HingeZero full repository audit

on:
  push:
    branches:
      - desktop-license-v0.1.2
      - desktop-release-v0.1.3
    paths:
      - 'desktop/**'
      - 'secure_memory/**'
      - 'HingeZero_*.py'
      - 'HingeZero_*.cpp'
      - 'parity_check.py'
      - 'run_smoke.sh'
      - 'verify_recorded_results.py'
      - '.github/workflows/full-repository-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-cpp:
    name: C++20, recorded evidence, Python parity, sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Compile C++ research source with warnings enabled
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic HingeZero_Native_1B.cpp -o hz_native
      - name: C++ append/witness/retrieval smoke test
        run: bash run_smoke.sh
      - name: Verify recorded 12-case CSV consistency
        run: python verify_recorded_results.py
      - name: C++ vs Python HingeZero parity test
        run: python parity_check.py
      - name: Check for undefined behaviour and memory faults
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=undefined -fno-omit-frame-pointer HingeZero_Native_1B.cpp -o /tmp/hz_native_ubsan
          tempdir=$(mktemp -d)
          trap 'rm -rf "$tempdir"' EXIT
          /tmp/hz_native_ubsan create "$tempdir/bank" 8192
          /tmp/hz_native_ubsan append "$tempdir/bank" 8192 256
          /tmp/hz_native_ubsan check "$tempdir/bank" 8448 417
          /tmp/hz_native_ubsan test "$tempdir/bank" 8448 417 flip20

  secure-memory:
    name: Secure Memory package tests incl MCP bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: secure_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[mcp,dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: python -m pip check

  desktop:
    name: Desktop full regression / interface imports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk tk
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: python -m hzdesktop.selfcheck
      - run: python -m compileall -q hzdesktop tests
