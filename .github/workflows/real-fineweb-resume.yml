name: FineWeb source resume integrity
on:
  push:
    branches:
      - fix/real-benchmark-resume-integrity-2026-11-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch 180 authentic FineWeb rows once via its public REST dataset server
        run: python benchmarks/fetch_fineweb_rows.py --rows 180 --output "${RUNNER_TEMP}/fineweb.jsonl"
      - name: First real-source segment
        run: python benchmarks/real_fineweb.py --source-jsonl "${RUNNER_TEMP}/fineweb.jsonl" --records 40 --queries 5 --shard-dir "${RUNNER_TEMP}/resume-shards" --shard-size 20 --out "${RUNNER_TEMP}/part40.json"
      - name: Resume without replacing earlier encrypted shards
        run: python benchmarks/real_fineweb.py --source-jsonl "${RUNNER_TEMP}/fineweb.jsonl" --records 80 --queries 5 --shard-dir "${RUNNER_TEMP}/resume-shards" --shard-size 20 --resume --out "${RUNNER_TEMP}/resume80.json"
      - name: One-shot reference run on the same public source
        run: python benchmarks/real_fineweb.py --source-jsonl "${RUNNER_TEMP}/fineweb.jsonl" --records 80 --queries 5 --out "${RUNNER_TEMP}/fresh80.json"
      - name: Verify full 80-row provenance digest and counts match
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          a = json.loads((root / "resume80.json").read_text())["summary"]
          b = json.loads((root / "fresh80.json").read_text())["summary"]
          assert a["actual_encrypted_records"] == b["actual_encrypted_records"] == 80
          assert a["existing_records_at_start"] == 40
          assert a["shards"] == 4
          assert a["source_record_digest"] == b["source_record_digest"], (a["source_record_digest"], b["source_record_digest"])
          assert a["status"] == b["status"] == "PASS"
          print("REAL_SOURCE_RESUME_INTEGRITY=PASS")
          PY
