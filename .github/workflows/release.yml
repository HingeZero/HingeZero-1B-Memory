name: Build, test, audit and release desktop binaries

on:
  push:
    branches:
      - desktop-license-v0.1.2
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt 'pip-audit>=2.9,<4' 'bandit>=1.8,<3'
      - run: python -m pytest -q
      - run: python -m hzdesktop.selfcheck
      - name: Static security analysis (Bandit)
        run: python -m bandit -r hzdesktop -ll -ii -q
      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Audit build/test dependencies
        run: python -m pip_audit -r requirements-build.txt

  codeql:
    name: CodeQL Python and workflow scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python,actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  package:
    needs: [security, codeql]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Tk dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HZMemory --collect-all cryptography --collect-all pypdf launcher.py
          Copy-Item LICENSE.md dist/LICENSE.md
          Copy-Item NOTICE.txt dist/NOTICE.txt
          Copy-Item COMMERCIAL-LICENSING.md dist/COMMERCIAL-LICENSING.md
          Compress-Archive -Path dist/HZMemory.exe,dist/LICENSE.md,dist/NOTICE.txt,dist/COMMERCIAL-LICENSING.md -DestinationPath HZMemory-Windows-x64.zip
        shell: pwsh
      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --name HZMemory --collect-all cryptography --collect-all pypdf launcher.py
          cp LICENSE.md NOTICE.txt COMMERCIAL-LICENSING.md dist/
          tar -czf HZMemory-Linux-x64.tar.gz -C dist HZMemory LICENSE.md NOTICE.txt COMMERCIAL-LICENSING.md
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name HZMemory --collect-all cryptography --collect-all pypdf launcher.py
          cp LICENSE.md NOTICE.txt COMMERCIAL-LICENSING.md dist/HZMemory.app/Contents/Resources/
          ditto -c -k --sequesterRsrc --keepParent dist/HZMemory.app HZMemory-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/HZMemory-Windows-x64.zip
            desktop/HZMemory-Linux-x64.tar.gz
            desktop/HZMemory-macOS.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop/release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: desktop/release-assets
        run: sha256sum HZMemory-* > SHA256SUMS.txt
      - name: Create GitHub Release once for version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Existing published binaries will not be overwritten."
            exit 0
          fi
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" --title "HingeZero Memory Desktop $TAG" \
            --notes 'HingeZero Memory Desktop v0.1.2. Free permitted noncommercial use under PolyForm Noncommercial 1.0.0; paid separate agreement for commercial use. Licence and required notice are inside each archive. This scope is limited to desktop/ software; research files elsewhere in the repository are not relicensed. Unsigned preview binaries; verify SHA256SUMS.txt before use.'
