name: HingeZero genuine 1-bit cross-constraint experiment

on:
  push:
    branches:
      - experiment/one-bit-cross-constraint-2026-11-06
    paths:
      - 'benchmarks/one-bit-cross-constraint-2026-11-06/**'
      - '.github/workflows/one-bit-cross-constraint.yml'
  pull_request:
    paths:
      - 'benchmarks/one-bit-cross-constraint-2026-11-06/**'
      - '.github/workflows/one-bit-cross-constraint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-bit-cross-constraint:
    name: Packed 1-bit Hamming + original HZ0/HZ8 Witness + explicit constraints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Unit tests for genuine 1-bit representation and fail-closed logic
        run: python -m unittest discover -s benchmarks/one-bit-cross-constraint-2026-11-06 -p 'test_*.py' -v
      - name: Benchmark all modes and noisy bit-cue regimes
        run: |
          PYTHONUNBUFFERED=1 python benchmarks/one-bit-cross-constraint-2026-11-06/run_benchmark.py \
            --records 180 --output /tmp/one_bit_cross_constraint_results.json
      - name: Upload full independent run metrics for review
        uses: actions/upload-artifact@v4
        with:
          name: one-bit-cross-constraint-results
          path: /tmp/one_bit_cross_constraint_results.json
