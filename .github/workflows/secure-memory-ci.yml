name: HingeZero Secure Memory CI
on:
  push:
    paths:
      - 'secure_memory/**'
      - '.github/workflows/secure-memory-ci.yml'
  pull_request:
    paths:
      - 'secure_memory/**'
      - '.github/workflows/secure-memory-ci.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure_memory
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[mcp,dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python -m pip check
      - run: bandit -r src -ll
      - run: pip-audit
